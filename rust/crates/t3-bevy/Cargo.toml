[package]
name = "t3-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
psx-core = { path = "../psx-core" }
psx-runtime = { path = "../psx-runtime" }
t3-recomp = { path = "../t3-recomp" }
cpal = "0.17"
# Sony pads over HID (hid.rs); the pure-Rust Windows backend needs no C compiler.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
